name: CI Test & Lint Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Validate Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: npm install

      - name: Syntax Check Configurations
        run: node --check eslint/*.js stylelint/*.js

      - name: Run Integration Tests
        run: npm run test:lint
